---
- name: Validate bootstrap polling settings
  ansible.builtin.assert:
    that:
      - ocp5_rhacs_wait_for_apps_timeout | int > 0
      - ocp5_rhacs_wait_for_apps_attempts | int > 0
      - ocp5_rhacs_wait_for_apps_delay | int >= 0
      - ocp5_rhacs_wait_for_apps_ready_samples | int > 0
      - ocp5_rhacs_bootstrap_recovery_limit | int >= 0
      - ocp5_rhacs_bootstrap_recovery_cooldown_polls | int >= 1

- name: Initialize bounded ArgoCD bootstrap recovery
  ansible.builtin.set_fact:
    r_argocd_bootstrap_ready: false
    r_bootstrap_deadline: >-
      {{ lookup('pipe', 'date +%s') | int + ocp5_rhacs_wait_for_apps_timeout | int }}
    r_bootstrap_recoveries: {}
    r_bootstrap_ready_samples: 0
    r_bootstrap_platform_samples: 0
    r_bootstrap_state:
      pending: []
      parent_ready: false

- name: Wait for child ArgoCD Applications with bounded recovery
  ansible.builtin.include_tasks: wait_for_apps_poll.yml
  loop: "{{ range(0, ocp5_rhacs_wait_for_apps_attempts | int) | list }}"
  loop_control:
    loop_var: r_bootstrap_poll
    label: "poll {{ r_bootstrap_poll | int + 1 }}"
  when:
    - not r_argocd_bootstrap_ready | bool
    - lookup('pipe', 'date +%s') | int < r_bootstrap_deadline | int

- name: Require all child Applications and parent to finish Synced and Healthy
  ansible.builtin.assert:
    that:
      - r_argocd_bootstrap_ready | bool
    fail_msg: >-
      ArgoCD bootstrap did not converge within {{ ocp5_rhacs_wait_for_apps_attempts }} polls.
      Parent ready: {{ r_bootstrap_state.parent_ready }}.
      Pending applications: {{ r_bootstrap_state.pending }}.
      Recovery attempts: {{ r_bootstrap_recoveries }}.
    success_msg: All watched Applications and app-of-apps finished Synced and Healthy.
  register: r_bootstrap_assertion
  ignore_errors: "{{ ocp5_rhacs_wait_for_apps_ignore_errors }}"

- name: Warn when bootstrap failure is explicitly ignored
  ansible.builtin.debug:
    msg: >-
      WARNING: ArgoCD readiness failed and was explicitly ignored by configuration.
      Provisioning continues, but this is NOT a successful GitOps validation.
      Pending applications: {{ r_bootstrap_state.pending }}.
  when: r_bootstrap_assertion is failed
