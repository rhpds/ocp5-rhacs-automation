---
# ------------------------------------------------
# App-of-apps GitOps source
# ------------------------------------------------

ocp5_rhacs_wait_for_apps_ignore_errors: false

ocp5_rhacs_gitops_repo: https://github.com/rhpds/ocp5-rhacs-gitops.git
ocp5_rhacs_gitops_repo_tag: main

# ------------------------------------------------
# OpenShift GitOps
# ------------------------------------------------

ocp5_rhacs_openshift_gitops_install: true

ocp5_rhacs_openshift_gitops_operator_channel: latest
ocp5_rhacs_openshift_gitops_operator_automatic_install_plan_approval: true
ocp5_rhacs_openshift_gitops_operator_starting_csv: ""
ocp5_rhacs_openshift_gitops_operator_name: openshift-gitops-operator
ocp5_rhacs_openshift_gitops_operator_namespace: openshift-operators
# Catalog source pinning for GitOps operator — placeholder for future pinning
ocp5_rhacs_openshift_gitops_operator_catalog: redhat-operators-v422
ocp5_rhacs_openshift_gitops_operator_use_catalog_snapshot: true
ocp5_rhacs_openshift_gitops_operator_catalogsource_name: redhat-operators-v422
ocp5_rhacs_openshift_gitops_operator_catalogsource_namespace: openshift-marketplace
ocp5_rhacs_openshift_gitops_operator_catalog_snapshot_image: quay.io/rhpds/olm_snapshot_redhat_catalog
ocp5_rhacs_openshift_gitops_operator_catalog_snapshot_image_tag: v4.22_2026_08_03

ocp5_rhacs_openshift_gitops_operator_config:
  env:
    - name: ARGOCD_CLUSTER_CONFIG_NAMESPACES
      value: 'openshift-gitops'

ocp5_rhacs_openshift_gitops_setup_cluster_admin: true

ocp5_rhacs_openshift_gitops_enable_route: true
ocp5_rhacs_openshift_gitops_update_route_tls: true

ocp5_rhacs_openshift_gitops_update_resources: true

# Application Controller
ocp5_rhacs_openshift_gitops_controller_update: true
ocp5_rhacs_openshift_gitops_controller_requests_cpu: 512m
ocp5_rhacs_openshift_gitops_controller_requests_memory: 1Gi
ocp5_rhacs_openshift_gitops_controller_limits_cpu: "4"
ocp5_rhacs_openshift_gitops_controller_limits_memory: 4Gi
ocp5_rhacs_openshift_gitops_controller_app_sync: 30s
# How often Argo CD fetches git (upstream default is 3m).
ocp5_rhacs_openshift_gitops_timeout_reconciliation: 30s

ocp5_rhacs_openshift_gitops_controller_remove_memory_limits: false

# Repo Server
ocp5_rhacs_openshift_gitops_repo_update: true
ocp5_rhacs_openshift_gitops_repo_requests_cpu: 500m
ocp5_rhacs_openshift_gitops_repo_requests_memory: 512Mi
ocp5_rhacs_openshift_gitops_repo_limits_cpu: "2"
ocp5_rhacs_openshift_gitops_repo_limits_memory: 2Gi

ocp5_rhacs_openshift_gitops_resource_customizations: |
  operators.coreos.com/Subscription:
    health.lua: |
      health_status = {}
      if obj.status ~= nil then
        if obj.status.conditions ~= nil then
          numDegraded = 0
          numPending = 0
          msg = ""
          for i, condition in pairs(obj.status.conditions) do
            msg = msg .. i .. ": " .. condition.type .. " | " .. condition.status .. "\n"
            if condition.type == "InstallPlanPending" and condition.status == "True" then
              numPending = numPending + 1
            elseif (condition.type == "InstallPlanMissing" and condition.reason ~= "ReferencedInstallPlanNotFound") then
              numDegraded = numDegraded + 1
            elseif (condition.type == "CatalogSourcesUnhealthy" or condition.type == "InstallPlanFailed") and condition.status == "True" then
              numDegraded = numDegraded + 1
            end
          end
          if numDegraded == 0 and numPending == 0 then
            health_status.status = "Healthy"
            health_status.message = msg
            return health_status
          elseif numPending > 0 and numDegraded == 0 then
            health_status.status = "Progressing"
            health_status.message = "An install plan for a subscription is pending installation"
            return health_status
          else
            health_status.status = "Degraded"
            health_status.message = msg
            return health_status
          end
        end
      end
      health_status.status = "Progressing"
      health_status.message = "An install plan for a subscription is pending installation"
      return health_status

ocp5_rhacs_openshift_gitops_ignore_differences: {}

# ------------------------------------------------
# Operator catalog source pinning (Helm app-of-apps)
# Placeholder for future pinning — disabled by default.
# When enabled, a frozen OLM catalog snapshot is deployed and all operator
# subscriptions use it instead of the live redhat-operators catalog.
# ------------------------------------------------

ocp5_rhacs_catalog_source_enabled: true
ocp5_rhacs_catalog_source_name: redhat-operators-v422
ocp5_rhacs_catalog_source_namespace: openshift-marketplace
ocp5_rhacs_catalog_source_image: quay.io/rhpds/olm_snapshot_redhat_catalog
ocp5_rhacs_catalog_source_tag: v4.22_2026_08_03

# ------------------------------------------------
# OCP 5.0 console cert workaround
# ------------------------------------------------
ocp5_rhacs_console_cert_workaround: true
ocp5_rhacs_console_cert_source_secret: cert-manager-ingress-cert
ocp5_rhacs_console_cert_source_namespace: openshift-ingress
ocp5_rhacs_console_cert_target_secret: console-serving-cert

# ------------------------------------------------
# Red Hat Advanced Cluster Security
# ------------------------------------------------

ocp5_rhacs_acs_application_name: rhacs-operator
ocp5_rhacs_acs_namespace: rhacs-operator
ocp5_rhacs_acs_clustername: local-cluster
ocp5_rhacs_acs_adminpassword: "{{ common_password }}"

# ------------------------------------------------
# Showroom UserInfo / GitOps route contract
# Hostname prefixes must match GitOps (app-of-apps values + child charts)
# and Showroom ui-config.yml. Automation publishes fully resolved URLs;
# Antora does not interpolate {other_attr} inside antora.yml.
# ------------------------------------------------

ocp5_rhacs_acs_route_host: central-reencrypt-stackrox
ocp5_rhacs_acs_portal_username: admin
ocp5_rhacs_quay_route_host: registry-quay-quay
ocp5_rhacs_quay_admin_username: admin
ocp5_rhacs_gitops_route_host: openshift-gitops-server-openshift-gitops
ocp5_rhacs_workshop_user_suffix: "1"
# TSSC Keycloak cannot use sso.<domain> — RHDP RHBK already claims that host.
ocp5_rhacs_keycloak_route_host: sso-tpa
ocp5_rhacs_keycloak_admin_username: admin
ocp5_rhacs_keycloak_username: tpa-user
ocp5_rhacs_gitea_route_host: gitea
ocp5_rhacs_gitea_username: student
ocp5_rhacs_rhtpa_route_host: server-trusted-profile-analyzer
ocp5_rhacs_rhdh_route_host: backstage-developer-hub-rhdh

# ------------------------------------------------
# LLM Configuration
# ------------------------------------------------
ocp5_rhacs_llm_api_url: "https://ols-lightspeed-apim-pilot.azure-api.net/ols-test-openai"
ocp5_rhacs_llm_api_key: ""
ocp5_rhacs_llm_api_model: "gpt-5.4"
ocp5_rhacs_llm_api_provider: "openai"

# ------------------------------------------------
# ACS Nightly Pull Secret
# ------------------------------------------------
ocp5_rhacs_acs_pull_secret: ""

# ------------------------------------------------
# oc-agentic CLI plugin
# ------------------------------------------------
ocp5_rhacs_install_oc_agentic: true

# ------------------------------------------------
# FastMCP CLI (MCP Gateway exercises)
# ------------------------------------------------
ocp5_rhacs_install_fastmcp: true
ocp5_rhacs_fastmcp_version: "3.4.7"
